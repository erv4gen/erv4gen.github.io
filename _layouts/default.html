<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <!-- Overrides the jekyll-theme-minimal layout: a fixed sidebar (title, tagline, menu)
         next to one content column. Styles live in assets/css/style.scss. -->
    <div class="site">
      <aside class="side">
        <h1 class="site-title"><a href="{{ "/" | relative_url }}">{{ site.title }}</a></h1>
        <p class="tagline">{{ site.description }}</p>
        <hr class="rule">
        <nav class="menu">
          <a href="{{ "/" | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>Home</a>
          <a href="{{ "/about/" | relative_url }}"{% if page.url == "/about/" %} aria-current="page"{% endif %}>About</a>
          <a href="{{ "/posts/" | relative_url }}"{% if page.url == "/posts/" %} aria-current="page"{% endif %}>All posts</a>
        </nav>
        <p class="fine"><a href="{{ "/privacy-policy/" | relative_url }}">Privacy policy</a></p>
      </aside>

      <main class="content">
{{ content }}
      </main>
    </div>
  </body>
</html>
