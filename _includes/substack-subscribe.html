<!-- Substack's own embed, transparent so the page's paper background shows through.
     If it ever shows "refused to connect", the link below still works. -->
<iframe src="{{ site.substack_url }}/embed?transparent=1&light=1" width="480" height="320"
        style="border: 0; background: transparent; max-width: 100%;"
        frameborder="0" scrolling="no" title="Subscribe on Substack"></iframe>
<p style="font-size:0.9em;">Or read and subscribe on <a href="{{ site.substack_url }}">Substack</a>.</p>
